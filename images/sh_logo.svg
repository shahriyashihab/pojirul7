<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="shStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="shGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Gradient Stroke -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#shBg)" stroke="url(#shStroke)" stroke-width="3" filter="drop-shadow(0 4px 12px rgba(6,78,59,0.35))" />
  <rect x="12" y="12" width="96" height="96" rx="22" fill="none" stroke="url(#shStroke)" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3" />

  <!-- Stylized Geometric S and H Monogram -->
  <g filter="url(#shGlow)">
    <!-- Letter S -->
    <path d="M42 38 C42 32 30 32 30 42 C30 52 46 50 46 62 C46 72 32 72 32 66" fill="none" stroke="url(#shText)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter H -->
    <path d="M62 34 V74 M86 34 V74 M62 54 H86" fill="none" stroke="url(#shText)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Futuristic Corner Nodes -->
  <circle cx="94" cy="26" r="4.5" fill="#10b981" filter="url(#shGlow)" />
  <circle cx="26" cy="94" r="3" fill="#06b6d4" />
</svg>
